<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Styled room after redesign">
  <defs>
    <linearGradient id="wallWarm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7f1e6"/>
      <stop offset="1" stop-color="#efe5d3"/>
    </linearGradient>
    <linearGradient id="skyWarm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e6e0cf"/>
      <stop offset="1" stop-color="#f6f0e0"/>
    </linearGradient>
  </defs>

  <!-- wall -->
  <rect width="1600" height="640" fill="url(#wallWarm)"/>

  <!-- floor -->
  <rect y="620" width="1600" height="280" fill="#a97c50"/>
  <g stroke="#9a6f46" stroke-width="3" opacity="0.8">
    <line x1="0" y1="660" x2="1600" y2="660"/>
    <line x1="0" y1="740" x2="1600" y2="740"/>
    <line x1="0" y1="820" x2="1600" y2="820"/>
    <line x1="200" y1="620" x2="120" y2="900"/>
    <line x1="520" y1="620" x2="440" y2="900"/>
    <line x1="840" y1="620" x2="760" y2="900"/>
    <line x1="1160" y1="620" x2="1080" y2="900"/>
    <line x1="1480" y1="620" x2="1400" y2="900"/>
  </g>

  <!-- rug -->
  <ellipse cx="640" cy="760" rx="520" ry="110" fill="#f2ead8"/>
  <ellipse cx="640" cy="760" rx="440" ry="88" fill="none" stroke="#c9a96e" stroke-width="6"/>
  <ellipse cx="640" cy="760" rx="360" ry="68" fill="none" stroke="#c9a96e" stroke-width="3" opacity="0.6"/>

  <!-- sofa -->
  <g>
    <rect x="170" y="520" width="620" height="150" rx="26" fill="#8fa68b"/>
    <rect x="170" y="470" width="620" height="80" rx="30" fill="#9db29a"/>
    <rect x="160" y="520" width="70" height="150" rx="24" fill="#7d9479"/>
    <rect x="730" y="520" width="70" height="150" rx="24" fill="#7d9479"/>
    <rect x="740" y="430" width="150" height="120" rx="22" fill="#aebfa8"/>
    <rect x="330" y="440" width="170" height="120" rx="22" fill="#c9a96e"/>
    <rect x="520" y="440" width="170" height="120" rx="22" fill="#f7f1e6"/>
    <line x1="330" y1="500" x2="500" y2="500" stroke="#b08f56" stroke-width="3" opacity="0.5"/>
    <line x1="520" y1="500" x2="690" y2="500" stroke="#d8cdb8" stroke-width="3" opacity="0.6"/>
    <!-- legs -->
    <rect x="200" y="668" width="26" height="34" rx="6" fill="#5d4a33"/>
    <rect x="730" y="668" width="26" height="34" rx="6" fill="#5d4a33"/>
  </g>

  <!-- coffee table -->
  <rect x="420" y="640" width="300" height="46" rx="8" fill="#6b4f33"/>
  <rect x="450" y="686" width="18" height="52" rx="5" fill="#5d4229"/>
  <rect x="672" y="686" width="18" height="52" rx="5" fill="#5d4229"/>
  <ellipse cx="520" cy="628" rx="70" ry="14" fill="#5d4229" opacity="0.55"/>
  <ellipse cx="640" cy="620" rx="52" ry="12" fill="#2f4a34" opacity="0.9"/>

  <!-- floor lamp -->
  <g>
    <rect x="1430" y="430" width="10" height="220" rx="5" fill="#2d2b27"/>
    <path d="M1395 430h80l-10 60h-60z" fill="#c9a96e"/>
    <path d="M1398 494h74l-6 26h-62z" fill="#d9c39a" opacity="0.6"/>
    <ellipse cx="1435" cy="652" rx="42" ry="10" fill="#2d2b27"/>
  </g>

  <!-- plant -->
  <g>
    <path d="M105 560h110l-14 120h-82z" fill="#b08a5e"/>
    <path d="M160 560c-6-70-46-110-46-110 44 4 74 34 74 34s10-64 26-96c16 32 26 70 26 70 22-14 44-16 44-16-20 34-34 64-34 64 22 6 36 24 36 24-30 8-56 12-56 12" fill="#3f5a42"/>
    <ellipse cx="160" cy="700" rx="70" ry="16" fill="#000" opacity="0.12"/>
  </g>

  <!-- wall art -->
  <g>
    <rect x="300" y="180" width="240" height="180" rx="4" fill="#2d2b27"/>
    <rect x="316" y="196" width="208" height="148" fill="#e9dfc8"/>
    <circle cx="390" cy="262" r="34" fill="#c9a96e"/>
    <circle cx="440" cy="300" r="26" fill="#8fa68b"/>
    <path d="M316 344l60-50 46 34 52-44 50 60z" fill="#8fa68b" opacity="0.85"/>
  </g>

  <!-- window (warm light) -->
  <rect x="1060" y="150" width="380" height="380" rx="8" fill="url(#skyWarm)" stroke="#cbb996" stroke-width="10"/>
  <line x1="1250" y1="150" x2="1250" y2="530" stroke="#cbb996" stroke-width="10"/>
  <line x1="1060" y1="340" x2="1440" y2="340" stroke="#cbb996" stroke-width="10"/>
  <rect x="1120" y="210" width="260" height="90" fill="#c9a96e" opacity="0.35"/>

  <!-- curtains -->
  <path d="M1060 150v300c70 24 150-18 190-60V150z" fill="#c9a96e" opacity="0.85"/>
  <path d="M1440 150v300c-70 24-150-18-190-60V150z" fill="#c9a96e" opacity="0.85"/>

  <!-- baseboard -->
  <rect y="600" width="1600" height="20" fill="#cbb996"/>
</svg>
